<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>How it works</title>
<link rel="stylesheet" href="lib/gw.css" />
<script src="vendor/gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1920" data-height="1080">

  <!-- Header -->
  <div class="a m" id="eyebrow" style="left:160px;top:120px;font-size:24px;letter-spacing:3px;color:var(--c);opacity:0">Process / 03 steps</div>
  <div class="a h" id="title" style="left:158px;top:158px;font-size:120px;opacity:0">How <span class="hl">it works</span></div>
  <div class="a" id="rule" style="left:160px;top:322px;width:520px;height:6px;background:var(--m);transform-origin:left center"></div>

  <!-- Connectors (behind cards) -->
  <div class="a" id="conn1" style="left:560px;top:615px;width:170px;height:6px;background:var(--c);opacity:0.85;transform-origin:left center"></div>
  <div class="a" id="conn2" style="left:1200px;top:615px;width:170px;height:6px;background:var(--c);opacity:0.85;transform-origin:left center"></div>

  <!-- Step 1 -->
  <div class="a" id="card1" style="left:160px;top:430px;width:400px;height:440px;background:#171717;border:2px solid #2A2A2A;opacity:0"></div>
  <div class="a h" id="num1" style="left:180px;top:450px;font-size:52px;color:var(--c);opacity:0">01</div>
  <div class="a" id="icon1" style="left:338px;top:540px;width:124px;height:124px;opacity:0">
    <svg viewBox="0 0 100 100" width="124" height="124" fill="none" stroke="#F4F4F1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 16 H64 L80 32 V84 H28 Z"/>
      <path d="M64 16 V32 H80"/>
      <path d="M40 48 H70"/>
      <path d="M40 62 H70"/>
      <path d="M40 76 H56"/>
    </svg>
  </div>
  <div class="a h" id="lbl1" style="left:180px;top:740px;width:360px;font-size:34px;opacity:0">Write a brief</div>

  <!-- Step 2 -->
  <div class="a" id="card2" style="left:800px;top:430px;width:400px;height:440px;background:#171717;border:2px solid #2A2A2A;opacity:0"></div>
  <div class="a h" id="num2" style="left:820px;top:450px;font-size:52px;color:var(--c);opacity:0">02</div>
  <div class="a" id="icon2" style="left:978px;top:540px;width:124px;height:124px;opacity:0">
    <svg viewBox="0 0 100 100" width="124" height="124" fill="none" stroke="#F4F4F1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M34 28 L16 50 L34 72"/>
      <path d="M66 28 L84 50 L66 72"/>
      <path d="M58 26 L42 74"/>
    </svg>
  </div>
  <div class="a h" id="lbl2" style="left:820px;top:740px;width:360px;font-size:34px;opacity:0">Model writes the code</div>

  <!-- Step 3 -->
  <div class="a" id="card3" style="left:1440px;top:430px;width:400px;height:440px;background:#171717;border:2px solid #2A2A2A;opacity:0"></div>
  <div class="a h" id="num3" style="left:1460px;top:450px;font-size:52px;color:var(--c);opacity:0">03</div>
  <div class="a" id="icon3" style="left:1618px;top:540px;width:124px;height:124px;opacity:0">
    <svg viewBox="0 0 100 100" width="124" height="124" fill="none" stroke="#F4F4F1" stroke-width="6" stroke-linejoin="round">
      <path d="M14 14 H86 V86 H14 Z"/>
      <path d="M40 34 L70 50 L40 66 Z" fill="#F4F4F1"/>
    </svg>
  </div>
  <div class="a h" id="lbl3" style="left:1460px;top:740px;width:360px;font-size:34px;opacity:0">Render the video</div>

  <!-- Footer -->
  <div class="a m" id="foot" style="left:160px;top:930px;font-size:22px;letter-spacing:3px;color:#8A8A85;opacity:0">Brief &rarr; Code &rarr; Video</div>

</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // Header
  tl.to("#eyebrow", { opacity: 1, duration: 0.4 }, 0.2);
  tl.fromTo("#title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.4);
  tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 0.9);

  // Step 1
  tl.fromTo("#card1", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.1);
  tl.fromTo("#num1", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.3);
  tl.fromTo("#icon1", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 1.4);
  tl.to("#lbl1", { opacity: 1, duration: 0.4 }, 1.6);

  // Connector 1
  tl.fromTo("#conn1", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 1.9);

  // Step 2
  tl.fromTo("#card2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.3);
  tl.fromTo("#num2", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 2.5);
  tl.fromTo("#icon2", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 2.6);
  tl.to("#lbl2", { opacity: 1, duration: 0.4 }, 2.8);

  // Connector 2
  tl.fromTo("#conn2", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 3.1);

  // Step 3
  tl.fromTo("#card3", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 3.5);
  tl.fromTo("#num3", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 3.7);
  tl.fromTo("#icon3", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 3.8);
  tl.to("#lbl3", { opacity: 1, duration: 0.4 }, 4.0);

  // Footer
  tl.to("#foot", { opacity: 1, duration: 0.5 }, 4.5);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
