<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Grawwww Studio — Local AI, delivered</title>
<link rel="stylesheet" href="lib/gw.css" />
<script src="vendor/gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">

  <!-- ============ SLAM LINES ============ -->
  <div class="a h" id="l1" style="left:160px;top:300px;font-size:180px;opacity:0">Agents.</div>
  <div class="a h" id="l2" style="left:160px;top:470px;font-size:180px;opacity:0">Automations.</div>
  <div class="a h" id="l3" style="left:160px;top:640px;font-size:180px;opacity:0">Video.</div>

  <!-- ============ FEATURE CHIPS ============ -->
  <div class="a" id="c1" style="left:160px;top:410px;width:480px;height:200px;border:3px solid var(--ink);opacity:0">
    <div class="a m" id="c1i" style="left:44px;top:44px;width:80px;height:80px;opacity:0"></div>
    <div class="a m" style="left:44px;top:150px;font-size:22px;color:var(--ink)">Runs on your hardware</div>
  </div>
  <div class="a" id="c2" style="left:720px;top:410px;width:480px;height:200px;border:3px solid var(--ink);opacity:0">
    <div class="a m" style="left:44px;top:44px;width:80px;height:80px;color:var(--c)">
      <svg viewBox="0 0 64 64" width="80" height="80" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="square">
        <line x1="10" y1="14" x2="54" y2="14" />
        <line x1="10" y1="32" x2="40" y2="32" />
        <line x1="10" y1="50" x2="54" y2="50" />
        <line x1="52" y1="24" x2="14" y2="44" />
      </svg>
    </div>
    <div class="a m" style="left:44px;top:150px;font-size:22px;color:var(--ink)">No per-token bill</div>
  </div>
  <div class="a" id="c3" style="left:1280px;top:410px;width:480px;height:200px;border:3px solid var(--ink);opacity:0">
    <div class="a m" style="left:44px;top:44px;width:80px;height:80px;color:var(--m)">
      <svg viewBox="0 0 64 64" width="80" height="80" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="miter">
        <path d="M32 6 L56 16 V32 C56 46 46 56 32 60 C18 56 8 46 8 32 V16 Z" />
        <line x1="22" y1="32" x2="42" y2="32" />
        <line x1="32" y1="32" x2="32" y2="44" />
      </svg>
    </div>
    <div class="a m" style="left:44px;top:150px;font-size:22px;color:var(--ink)">Your data stays put</div>
  </div>

  <!-- ============ LOGO + TAGLINE ============ -->
  <img id="logo" src="assets/logo-negative.png" alt="Grawwww Studio" style="position:absolute;left:810px;top:250px;width:300px;height:300px;opacity:0" />
  <div class="a h" id="tag" style="left:460px;top:620px;width:1000px;text-align:center;font-size:90px;opacity:0">Local AI, <span class="hl">delivered</span>.</div>
</div>

<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // ---- SLAM LINES (0-3s) ----
  tl.fromTo("#l1", { opacity: 0, x: -70, scale: 1.35 }, { opacity: 1, x: 0, scale: 1, duration: 0.35, ease: "power4.out" }, 0.25);
  tl.fromTo("#l2", { opacity: 0, x: -70, scale: 1.35 }, { opacity: 1, x: 0, scale: 1, duration: 0.35, ease: "power4.out" }, 0.85);
  tl.fromTo("#l3", { opacity: 0, x: -70, scale: 1.35 }, { opacity: 1, x: 0, scale: 1, duration: 0.35, ease: "power4.out" }, 1.45);

  // ---- CLEAR LINES (2.85-3.2s) ----
  tl.to("#l1", { opacity: 0, x: 70, duration: 0.3, ease: "power2.in" }, 2.85);
  tl.to("#l2", { opacity: 0, x: 70, duration: 0.3, ease: "power2.in" }, 2.9);
  tl.to("#l3", { opacity: 0, x: 70, duration: 0.3, ease: "power2.in" }, 2.95);

  // ---- FEATURE CHIPS (3.2-6.8s) ----
  tl.fromTo("#c1", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 3.2);
  tl.fromTo("#c2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 3.5);
  tl.fromTo("#c3", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 3.8);
  tl.fromTo("#c1i", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.7)" }, 3.5);

  // ---- CLEAR CHIPS (6.5-6.9s) ----
  tl.to("#c1", { opacity: 0, y: -40, duration: 0.4, ease: "power2.in" }, 6.5);
  tl.to("#c2", { opacity: 0, y: -40, duration: 0.4, ease: "power2.in" }, 6.6);
  tl.to("#c3", { opacity: 0, y: -40, duration: 0.4, ease: "power2.in" }, 6.7);

  // ---- LOGO (7.0-7.9s) ----
  tl.fromTo("#logo", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.9, ease: "power2.out" }, 7.0);

  // ---- TAGLINE (7.6-8.6s) ----
  tl.fromTo("#tag", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 7.6);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
