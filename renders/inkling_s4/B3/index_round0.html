<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Render time per card — Chart reveal</title>
<link rel="stylesheet" href="lib/gw.css" />
<script src="vendor/gsap.min.js"></script>
<style>
  .hl { background:#FFD400; color:#111; padding:4px 14px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">

  <div class="a" id="dot" style="left:160px;top:126px;width:16px;height:16px;background:var(--c);opacity:0"></div>
  <div class="a m" id="eyebrow" style="left:192px;top:118px;font-size:24px;color:var(--c);opacity:0">Chart reveal / Render performance</div>
  <div class="a h" id="title" style="left:160px;top:158px;font-size:76px;color:#F4F4F1;opacity:0">Render time per card <span style="color:var(--c)">(s)</span></div>
  <div class="a" id="rule" style="left:160px;top:276px;width:1080px;height:6px;background:var(--m);transform-origin:left center"></div>
  <div class="a m" id="unit" style="left:560px;top:352px;font-size:18px;color:#8A8A8A;opacity:0">Unit: seconds</div>

  <!-- Row 0 : Title 42 -->
  <div class="a m" id="idx0" style="left:160px;top:416px;font-size:20px;color:var(--m);opacity:0">01</div>
  <div class="a m" id="lab0" style="left:236px;top:409px;width:300px;font-size:28px;color:#F4F4F1;opacity:0">Title</div>
  <div class="a" id="track0" style="left:560px;top:400px;width:960px;height:64px;background:#1B1B1B"></div>
  <div class="a" id="bar0" style="left:560px;top:400px;width:0px;height:64px;background:var(--c)"></div>
  <div class="a m" id="val0" style="left:560px;top:409px;font-size:34px;font-weight:700;color:#F4F4F1;opacity:0">42 s</div>

  <!-- Row 1 : Explainer 58 (max) -->
  <div class="a m" id="idx1" style="left:160px;top:566px;font-size:20px;color:var(--m);opacity:0">02</div>
  <div class="a m" id="lab1" style="left:236px;top:559px;width:300px;font-size:28px;color:#F4F4F1;opacity:0">Explainer</div>
  <div class="a" id="track1" style="left:560px;top:550px;width:960px;height:64px;background:#1B1B1B"></div>
  <div class="a" id="bar1" style="left:560px;top:550px;width:0px;height:64px;background:var(--c)"></div>
  <div class="a m hl" id="val1" style="left:560px;top:554px;font-size:34px;font-weight:700;opacity:0">58 s</div>

  <!-- Row 2 : Chart 51 -->
  <div class="a m" id="idx2" style="left:160px;top:716px;font-size:20px;color:var(--m);opacity:0">03</div>
  <div class="a m" id="lab2" style="left:236px;top:709px;width:300px;font-size:28px;color:#F4F4F1;opacity:0">Chart</div>
  <div class="a" id="track2" style="left:560px;top:700px;width:960px;height:64px;background:#1B1B1B"></div>
  <div class="a" id="bar2" style="left:560px;top:700px;width:0px;height:64px;background:var(--c)"></div>
  <div class="a m" id="val2" style="left:560px;top:709px;font-size:34px;font-weight:700;color:#F4F4F1;opacity:0">51 s</div>

  <!-- Row 3 : Lower third 23 -->
  <div class="a m" id="idx3" style="left:160px;top:866px;font-size:20px;color:var(--m);opacity:0">04</div>
  <div class="a m" id="lab3" style="left:236px;top:859px;width:300px;font-size:28px;color:#F4F4F1;opacity:0">Lower third</div>
  <div class="a" id="track3" style="left:560px;top:850px;width:960px;height:64px;background:#1B1B1B"></div>
  <div class="a" id="bar3" style="left:560px;top:850px;width:0px;height:64px;background:var(--c)"></div>
  <div class="a m" id="val3" style="left:560px;top:859px;font-size:34px;font-weight:700;color:#F4F4F1;opacity:0">23 s</div>

  <div class="a m" id="footer" style="left:160px;top:944px;font-size:20px;color:#8A8A8A;opacity:0">Source: JSON — 4 cards — values in seconds</div>

</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  tl.to("#dot", { opacity: 1, duration: 0.3 }, 0.2);
  tl.to("#eyebrow", { opacity: 1, duration: 0.4 }, 0.25);
  tl.fromTo("#title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.45);
  tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 0.75);
  tl.to("#unit", { opacity: 1, duration: 0.4 }, 1.0);

  const W = [696, 960, 844, 381]; // proportional to 42 / 58 / 51 / 23 (max 58 -> 960px)

  for (let i = 0; i < 4; i++) {
    const t = 1.3 + i * 1.05;
    tl.to("#idx" + i, { opacity: 1, duration: 0.3 }, t);
    tl.to("#lab" + i, { opacity: 1, duration: 0.35 }, t + 0.05);
    tl.fromTo("#bar" + i, { width: 0 }, { width: W[i], duration: 0.85, ease: "power2.out" }, t);
    tl.fromTo("#val" + i, { opacity: 0, x: 0 }, { opacity: 1, x: W[i] + 18, duration: 0.8, ease: "power2.out" }, t + 0.12);
  }

  tl.to("#footer", { opacity: 1, duration: 0.5 }, 6.3);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
