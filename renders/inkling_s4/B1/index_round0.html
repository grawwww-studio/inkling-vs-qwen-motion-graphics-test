<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>EP05 — Local AI, real video</title>
<link rel="stylesheet" href="lib/gw.css" />
<script src="vendor/gsap.min.js"></script>
<style>
  .w { display: inline-block; }
  #band { position: absolute; left: -10px; right: -10px; top: 12px; bottom: 12px; background: #FFD400; transform-origin: left center; }
  #w3 { position: relative; }
  #w3text { position: relative; z-index: 1; }
  #rule { transform-origin: left center; }
  #sq { transform-origin: center center; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">

  <div class="a h" id="ghost" style="left:1300px;top:340px;width:520px;font-size:400px;line-height:1;color:#181818;opacity:0">05</div>

  <div class="a m" id="eyebrow" style="left:196px;top:330px;width:900px;font-size:26px;letter-spacing:0.32em;color:#12A9E6;opacity:0">EP05 / Experiment</div>
  <div class="a" id="sq" style="left:160px;top:331px;width:18px;height:18px;background:#FF2D92"></div>

  <div class="a h" id="title" style="left:160px;top:400px;width:1300px;font-size:150px;line-height:1.06;letter-spacing:0.02em">
    <span class="w" id="w1">LOCAL</span> <span class="w" id="w2">AI,</span><br /><span class="w" id="w3"><span id="band"></span><span id="w3text">REAL</span></span> <span class="w" id="w4">VIDEO</span>
  </div>

  <div class="a" id="rule" style="left:160px;top:790px;width:1150px;height:5px;background:#12A9E6"></div>

  <div class="a m" id="caption" style="left:160px;top:920px;width:900px;font-size:20px;letter-spacing:0.3em;color:#5c5c5c;opacity:0">EP05 / TITLE CARD</div>

</div>

<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // Initial states
  tl.set("#ghost", { opacity: 0 }, 0);
  tl.set("#sq", { scale: 0 }, 0);
  tl.set("#eyebrow", { opacity: 0, x: -24 }, 0);
  tl.set("#w1, #w2, #w3, #w4", { opacity: 0, x: -80 }, 0);
  tl.set("#band", { scaleX: 0 }, 0);
  tl.set("#rule", { scaleX: 0 }, 0);
  tl.set("#caption", { opacity: 0, y: 16 }, 0);

  // Ghost numeral + eyebrow
  tl.to("#ghost", { opacity: 1, duration: 1.0, ease: "power1.out" }, 0.1);
  tl.to("#sq", { scale: 1, duration: 0.4, ease: "back.out(2)" }, 0.2);
  tl.to("#eyebrow", { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.35);

  // Words slide in, one by one
  tl.to("#w1", { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 0.55);
  tl.to("#w2", { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 0.80);
  tl.to("#w3", { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 1.05);
  tl.to("#w4", { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 1.30);

  // Yellow marker band wipes in from the left
  tl.to("#band", { scaleX: 1, duration: 0.45, ease: "power2.inOut" }, 1.80);
  tl.to("#w3text", { color: "#111111", duration: 0.3, ease: "power1.out" }, 2.00);

  // Rule draws across + caption
  tl.to("#rule", { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 2.45);
  tl.to("#caption", { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.80);

  // Hold 3.3s -> 5.0s

  window.__timelines["main"] = tl;
</script>
</body>
</html>
