<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Lara Quinn — Lower Third</title>
<link rel="stylesheet" href="lib/gw.css" />
<script src="vendor/gsap.min.js"></script>
<style>
  #root { position: relative; width: 1920px; height: 1080px; background: #0E0E0E; overflow: hidden; }
  .a { position: absolute; }
  #bar  { left: 160px; top: 736px; width: 12px; height: 176px; background: #12A9E6; transform-origin: top center; }
  #name { left: 200px; top: 730px; width: 1100px; font-size: 96px; line-height: 1.05; letter-spacing: 2px; color: #F4F4F1; }
  #role { left: 200px; top: 862px; width: 900px; font-size: 26px; letter-spacing: 6px; color: rgba(244,244,241,0.75); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
  <div class="a" id="bar"></div>
  <div class="a h" id="name">Lara Quinn</div>
  <div class="a m" id="role">Presenter, Grawwww</div>
</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  tl.set("#bar", { scaleY: 0 }, 0);
  tl.set(["#name", "#role"], { opacity: 0 }, 0);

  // Cyan accent bar wipes in first
  tl.fromTo("#bar",
    { scaleY: 0 },
    { scaleY: 1, duration: 0.45, ease: "power3.out" },
    0.2);

  // Name slides in, then role line
  tl.fromTo("#name",
    { opacity: 0, x: -80 },
    { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" },
    0.55);
  tl.fromTo("#role",
    { opacity: 0, x: -60 },
    { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
    0.8);

  // Hold, then everything wipes out in the last 0.5 s
  tl.to("#role", { opacity: 0, x: -50, duration: 0.35, ease: "power2.in" }, 3.5);
  tl.to("#name", { opacity: 0, x: -70, duration: 0.4, ease: "power2.in" }, 3.5);
  tl.to("#bar",  { scaleY: 0, duration: 0.4, ease: "power2.in" }, 3.5);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
