<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  tl.set(["#header","#eyebrow","#bar","#line1","#line2","#line3","#chipLabel","#chip1","#chip2","#chip3","#logo","#endRule","#tagline","#endLabel"], { opacity: 0 }, 0);

  // Beat 2 — staggered chips

  tl.fromTo("#chip1", { opacity: 0, y: 64, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.5)" }, 3.4);
  tl.fromTo("#chip2", { opacity: 0, y: 64, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.5)" }, 4.25);

  tl.to(["#chipLabel","#chip1","#chip2","#chip3"], { opacity: 0, y: -44, scale: 0.95, duration: 0.45, stagger: 0.05, ease: "power2.in" }, 6.85);
  tl.to("#header", { opacity: 0, y: -14, duration: 0.4, ease: "power2.in" }, 6.85);

  // Beat 3 — logo + tagline

  tl.fromTo("#endRule", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.inOut" }, 8.3);

  tl.fromTo("#endLabel", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 8.95);

  window.__timelines["main"] = tl;
