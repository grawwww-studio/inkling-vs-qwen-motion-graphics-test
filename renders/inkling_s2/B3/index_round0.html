<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Render time per card — Chart reveal</title>
<link rel="stylesheet" href="lib/gw.css" />
<script src="vendor/gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">

  <img class="a" id="logo" src="assets/logo-negative.png" alt=""
       style="left:1620px;top:112px;width:140px;height:48px;object-fit:contain;object-position:right center;opacity:0" />

  <div class="a m" id="eyebrow"
       style="left:160px;top:118px;width:1100px;height:30px;font-size:22px;color:var(--c);letter-spacing:5px;opacity:0;display:flex;align-items:center">
    <span style="display:inline-block;width:14px;height:14px;background:var(--m);margin-right:18px"></span>
    RENDER METRICS — CARD SUITE
  </div>

  <div class="a h" id="title"
       style="left:160px;top:158px;width:1600px;font-size:66px;color:#F4F4F1;opacity:0">Render time per card (s)</div>

  <div class="a" id="rule"
       style="left:160px;top:292px;width:640px;height:6px;background:#FF2D92;transform-origin:left center"></div>

  <!-- gridlines -->
  <div class="a grid" style="left:519px;top:350px;width:2px;height:480px;background:rgba(244,244,241,0.10);opacity:0"></div>
  <div class="a grid" style="left:891px;top:350px;width:2px;height:480px;background:rgba(244,244,241,0.10);opacity:0"></div>
  <div class="a grid" style="left:1264px;top:350px;width:2px;height:480px;background:rgba(244,244,241,0.10);opacity:0"></div>
  <div class="a grid" style="left:1636px;top:350px;width:2px;height:480px;background:rgba(244,244,241,0.10);opacity:0"></div>

  <!-- tick labels -->
  <div class="a m grid" style="left:460px;top:842px;width:120px;font-size:18px;color:#6f6f6a;text-align:center;opacity:0">0 s</div>
  <div class="a m grid" style="left:832px;top:842px;width:120px;font-size:18px;color:#6f6f6a;text-align:center;opacity:0">20 s</div>
  <div class="a m grid" style="left:1205px;top:842px;width:120px;font-size:18px;color:#6f6f6a;text-align:center;opacity:0">40 s</div>
  <div class="a m grid" style="left:1577px;top:842px;width:120px;font-size:18px;color:#6f6f6a;text-align:center;opacity:0">60 s</div>

  <!-- Row 0 : Title 42 -->
  <div class="a m" id="lab-0" style="left:160px;top:386px;width:330px;height:54px;font-size:24px;color:#F4F4F1;letter-spacing:2px;display:flex;align-items:center;opacity:0">Title</div>
  <div class="a track" style="left:520px;top:380px;width:1120px;height:54px;background:rgba(244,244,241,0.05);opacity:0"></div>
  <div class="a" id="bar-0" style="left:520px;top:380px;width:783px;height:54px;background:#12A9E6;transform-origin:left center"></div>
  <div class="a" id="val-0" style="left:1325px;top:376px;width:150px;height:62px;display:flex;align-items:center;opacity:0"><span class="num" style="font-family:var(--display);font-size:42px;color:#F4F4F1;letter-spacing:1px">42</span><span style="font-family:var(--mono);font-size:18px;color:#12A9E6;margin-left:10px">s</span></div>

  <!-- Row 1 : Explainer 58 (largest) -->
  <div class="a m" id="lab-1" style="left:160px;top:516px;width:330px;height:54px;font-size:24px;color:#F4F4F1;letter-spacing:2px;display:flex;align-items:center;opacity:0">Explainer</div>
  <div class="a track" style="left:520px;top:510px;width:1120px;height:54px;background:rgba(244,244,241,0.05);opacity:0"></div>
  <div class="a" id="bar-1" style="left:520px;top:510px;width:1080px;height:54px;background:#12A9E6;transform-origin:left center"></div>
  <div class="a hl" id="val-1" style="left:1622px;top:506px;width:150px;height:62px;background:#FFD400;color:#111;display:flex;align-items:center;justify-content:center;transform-origin:left center"><span style="font-family:var(--display);font-size:42px;color:#111;letter-spacing:1px">58</span><span style="font-family:var(--mono);font-size:18px;color:#111;margin-left:8px">s</span></div>

  <!-- Row 2 : Chart 51 -->
  <div class="a m" id="lab-2" style="left:160px;top:646px;width:330px;height:54px;font-size:24px;color:#F4F4F1;letter-spacing:2px;display:flex;align-items:center;opacity:0">Chart</div>
  <div class="a track" style="left:520px;top:640px;width:1120px;height:54px;background:rgba(244,244,241,0.05);opacity:0"></div>
  <div class="a" id="bar-2" style="left:520px;top:640px;width:948px;height:54px;background:#12A9E6;transform-origin:left center"></div>
  <div class="a" id="val-2" style="left:1490px;top:636px;width:150px;height:62px;display:flex;align-items:center;opacity:0"><span style="font-family:var(--display);font-size:42px;color:#F4F4F1;letter-spacing:1px">51</span><span style="font-family:var(--mono);font-size:18px;color:#12A9E6;margin-left:10px">s</span></div>

  <!-- Row 3 : Lower third 23 -->
  <div class="a m" id="lab-3" style="left:160px;top:776px;width:330px;height:54px;font-size:24px;color:#F4F4F1;letter-spacing:2px;display:flex;align-items:center;opacity:0">Lower third</div>
  <div class="a track" style="left:520px;top:770px;width:1120px;height:54px;background:rgba(244,244,241,0.05);opacity:0"></div>
  <div class="a" id="bar-3" style="left:520px;top:770px;width:428px;height:54px;background:#12A9E6;transform-origin:left center"></div>
  <div class="a" id="val-3" style="left:970px;top:766px;width:150px;height:62px;display:flex;align-items:center;opacity:0"><span style="font-family:var(--display);font-size:42px;color:#F4F4F1;letter-spacing:1px">23</span><span style="font-family:var(--mono);font-size:18px;color:#12A9E6;margin-left:10px">s</span></div>

  <div class="a m" id="footer"
       style="left:160px;top:930px;width:1300px;font-size:18px;color:#6f6f6a;letter-spacing:3px;opacity:0">SOURCE — RENDER LOG / 4 CARDS / UNIT: SECONDS</div>

</div>

<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // initial states
  tl.set("#rule", { scaleX: 0 }, 0);
  tl.set(["#bar-0", "#bar-1", "#bar-2", "#bar-3"], { scaleX: 0 }, 0);
  tl.set("#val-1", { scaleX: 0 }, 0);

  // header
  tl.to("#logo", { opacity: 1, duration: 0.5 }, 0.2);
  tl.to("#eyebrow", { opacity: 1, duration: 0.5 }, 0.25);
  tl.fromTo("#title", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.4);
  tl.to("#rule", { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 0.9);

  // chart scaffolding
  tl.to(".grid", { opacity: 1, duration: 0.6 }, 1.05);
  tl.to(".track", { opacity: 1, duration: 0.5 }, 1.1);

  // rows: label -> bar -> value, staggered
  const starts = [1.25, 1.90, 2.55, 3.20];
  for (let i = 0; i < 4; i++) {
    tl.fromTo("#lab-" + i, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 1.15 + i * 0.65);
    tl.to("#bar-" + i, { scaleX: 1, duration: 0.9, ease: "power3.out" }, starts[i]);
    if (i === 1) {
      // largest bar: yellow band grows behind its value
      tl.to("#val-1", { scaleX: 1, duration: 0.5, ease: "power2.out" }, starts[i] + 0.55);
    } else {
      tl.fromTo("#val-" + i, { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, starts[i] + 0.55);
    }
  }

  // footer
  tl.to("#footer", { opacity: 1, duration: 0.5 }, 4.9);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
