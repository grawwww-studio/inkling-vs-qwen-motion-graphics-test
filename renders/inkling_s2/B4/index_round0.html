<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Lara Quinn — Lower Third</title>
<link rel="stylesheet" href="lib/gw.css" />
<script src="vendor/gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
  <div class="a" id="bar" style="left:160px;top:742px;width:640px;height:12px;background:var(--c);transform-origin:left center"></div>
  <div class="a h" id="name" style="left:160px;top:782px;width:1100px;font-size:104px;color:var(--ink)">Lara Quinn</div>
  <div class="a m" id="role" style="left:160px;top:922px;width:900px;font-size:28px;color:var(--c);letter-spacing:4px">Presenter, Grawwww</div>
</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // initial states
  tl.set("#bar", { scaleX: 0 }, 0);
  tl.set("#name", { x: -70, opacity: 0 }, 0);
  tl.set("#role", { x: -70, opacity: 0 }, 0);

  // entrance: cyan bar wipes in first, then text slides in
  tl.to("#bar", { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, 0.1);
  tl.to("#name", { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.45);
  tl.to("#role", { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.62);

  // hold (through 3.5s)

  // exit: everything wipes out in the last 0.5s
  tl.to("#bar", { scaleX: 0, duration: 0.45, ease: "power3.inOut" }, 3.5);
  tl.to("#role", { x: -50, opacity: 0, duration: 0.32, ease: "power2.in" }, 3.5);
  tl.to("#name", { x: -50, opacity: 0, duration: 0.35, ease: "power2.in" }, 3.55);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
