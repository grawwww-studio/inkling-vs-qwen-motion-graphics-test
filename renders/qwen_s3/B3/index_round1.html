<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>B3 — Render time per card (s)</title>
<link rel="stylesheet" href="lib/gw.css" />
<script src="vendor/gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">

  <!-- header -->
  <div class="a" id="mark" style="left:160px;top:112px;width:16px;height:16px;background:var(--c);opacity:0;transform-origin:center"></div>
  <div class="a m" id="eyebrow" style="left:192px;top:108px;width:900px;font-size:24px;color:var(--c);opacity:0">B3 / Chart reveal — JSON in, bars out</div>
  <div class="a h" id="title" style="left:160px;top:146px;width:1500px;font-size:74px;opacity:0">Render time per card (s)</div>
  <div class="a" id="rule" style="left:160px;top:254px;width:1600px;height:4px;background:rgba(244,244,241,0.22);transform-origin:left center;opacity:0"></div>

  <!-- gridlines (scale: 60 s = 1100 px) -->
  <div class="a" id="g0" style="left:460px;top:312px;width:2px;height:506px;background:rgba(244,244,241,0.35);opacity:0"></div>
  <div class="a" id="g1" style="left:643px;top:312px;width:2px;height:506px;background:rgba(244,244,241,0.10);opacity:0"></div>
  <div class="a" id="g2" style="left:827px;top:312px;width:2px;height:506px;background:rgba(244,244,241,0.10);opacity:0"></div>
  <div class="a" id="g3" style="left:1010px;top:312px;width:2px;height:506px;background:rgba(244,244,241,0.10);opacity:0"></div>
  <div class="a" id="g4" style="left:1193px;top:312px;width:2px;height:506px;background:rgba(244,244,241,0.10);opacity:0"></div>
  <div class="a" id="g5" style="left:1377px;top:312px;width:2px;height:506px;background:rgba(244,244,241,0.10);opacity:0"></div>
  <div class="a" id="g6" style="left:1560px;top:312px;width:2px;height:506px;background:rgba(244,244,241,0.10);opacity:0"></div>

  <!-- row 1 · Title · 42 s -->
  <div class="a m" id="l1" style="left:120px;top:344px;width:300px;text-align:right;font-size:26px;color:rgba(244,244,241,0.85);opacity:0">Title</div>
  <div class="a" id="t1" style="left:460px;top:330px;width:1100px;height:54px;background:rgba(244,244,241,0.06);opacity:0"></div>
  <div class="a" id="b1" style="left:460px;top:330px;width:770px;height:54px;background:var(--c);transform-origin:left center;opacity:0"></div>
  <div class="a h" id="v1" style="left:1256px;top:336px;width:140px;font-size:42px;opacity:0">42</div>

  <!-- row 2 · Explainer · 58 s · MAX -->
  <div class="a m" id="l2" style="left:120px;top:484px;width:300px;text-align:right;font-size:26px;color:rgba(244,244,241,0.85);opacity:0">Explainer</div>
  <div class="a" id="t2" style="left:460px;top:470px;width:1100px;height:54px;background:rgba(244,244,241,0.06);opacity:0"></div>
  <div class="a" id="b2" style="left:460px;top:470px;width:1063px;height:54px;background:var(--c);transform-origin:left center;opacity:0"></div>
  <div class="a h" id="v2" style="left:1549px;top:472px;width:180px;font-size:42px;opacity:0"><span class="hl" style="background:var(--y);color:#111;padding:2px 16px;display:inline-block;transform-origin:center">58</span></div>

  <!-- row 3 · Chart · 51 s -->
  <div class="a m" id="l3" style="left:120px;top:624px;width:300px;text-align:right;font-size:26px;color:rgba(244,244,241,0.85);opacity:0">Chart</div>
  <div class="a" id="t3" style="left:460px;top:610px;width:1100px;height:54px;background:rgba(244,244,241,0.06);opacity:0"></div>
  <div class="a" id="b3" style="left:460px;top:610px;width:935px;height:54px;background:var(--c);transform-origin:left center;opacity:0"></div>
  <div class="a h" id="v3" style="left:1421px;top:616px;width:140px;font-size:42px;opacity:0">51</div>

  <!-- row 4 · Lower third · 23 s -->
  <div class="a m" id="l4" style="left:120px;top:764px;width:300px;text-align:right;font-size:26px;color:rgba(244,244,241,0.85);opacity:0">Lower third</div>
  <div class="a" id="t4" style="left:460px;top:750px;width:1100px;height:54px;background:rgba(244,244,241,0.06);opacity:0"></div>
  <div class="a" id="b4" style="left:460px;top:750px;width:422px;height:54px;background:var(--c);transform-origin:left center;opacity:0"></div>
  <div class="a h" id="v4" style="left:908px;top:756px;width:140px;font-size:42px;opacity:0">23</div>

  <!-- axis -->
  <div class="a m" id="a0" style="left:438px;top:826px;width:44px;text-align:center;font-size:20px;color:rgba(244,244,241,0.5);opacity:0">0</div>
  <div class="a m" id="a1" style="left:621px;top:826px;width:44px;text-align:center;font-size:20px;color:rgba(244,244,241,0.5);opacity:0">10</div>
  <div class="a m" id="a2" style="left:805px;top:826px;width:44px;text-align:center;font-size:20px;color:rgba(244,244,241,0.5);opacity:0">20</div>
  <div class="a m" id="a3" style="left:988px;top:826px;width:44px;text-align:center;font-size:20px;color:rgba(244,244,241,0.5);opacity:0">30</div>
  <div class="a m" id="a4" style="left:1171px;top:826px;width:44px;text-align:center;font-size:20px;color:rgba(244,244,241,0.5);opacity:0">40</div>
  <div class="a m" id="a5" style="left:1355px;top:826px;width:44px;text-align:center;font-size:20px;color:rgba(244,244,241,0.5);opacity:0">50</div>
  <div class="a m" id="a6" style="left:1528px;top:826px;width:64px;text-align:center;font-size:20px;color:rgba(244,244,241,0.5);opacity:0">60 s</div>

  <!-- caption -->
  <div class="a m" id="capL" style="left:160px;top:896px;width:700px;font-size:22px;color:rgba(244,244,241,0.6);opacity:0">4 cards · total 174 s</div>
  <div class="a m" id="capR" style="left:1360px;top:896px;width:400px;text-align:right;font-size:22px;color:rgba(244,244,241,0.6);opacity:0">Unit: s</div>

</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // header
  tl.fromTo("#mark", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 0.15);
  tl.to("#eyebrow", { opacity: 1, duration: 0.4 }, 0.2);
  tl.fromTo("#title", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 0.35);
  tl.fromTo("#rule", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 0.7);

  // gridlines
  tl.to("#g0", { opacity: 1, duration: 0.35 }, 0.9);
  tl.to("#g1", { opacity: 1, duration: 0.35 }, 0.96);
  tl.to("#g2", { opacity: 1, duration: 0.35 }, 1.02);
  tl.to("#g3", { opacity: 1, duration: 0.35 }, 1.08);
  tl.to("#g4", { opacity: 1, duration: 0.35 }, 1.14);
  tl.to("#g5", { opacity: 1, duration: 0.35 }, 1.2);
  tl.to("#g6", { opacity: 1, duration: 0.35 }, 1.26);

  // axis labels
  tl.to("#a0", { opacity: 1, duration: 0.4 }, 1.2);
  tl.to("#a1", { opacity: 1, duration: 0.4 }, 1.24);
  tl.to("#a2", { opacity: 1, duration: 0.4 }, 1.28);
  tl.to("#a3", { opacity: 1, duration: 0.4 }, 1.32);
  tl.to("#a4", { opacity: 1, duration: 0.4 }, 1.36);
  tl.to("#a5", { opacity: 1, duration: 0.4 }, 1.4);
  tl.to("#a6", { opacity: 1, duration: 0.4 }, 1.44);

  // row 1 · Title 42
  tl.to("#t1", { opacity: 1, duration: 0.3 }, 1.35);
  tl.fromTo("#l1", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 1.4);
  tl.fromTo("#b1", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 1.0, ease: "power2.out" }, 1.5);
  tl.fromTo("#v1", { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 2.45);

  // row 2 · Explainer 58 (max)
  tl.to("#t2", { opacity: 1, duration: 0.3 }, 1.55);
  tl.fromTo("#l2", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 1.6);
  tl.fromTo("#b2", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 1.0, ease: "power2.out" }, 1.85);
  tl.fromTo("#v2", { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 2.8);

  // row 3 · Chart 51
  tl.to("#t3", { opacity: 1, duration: 0.3 }, 1.75);
  tl.fromTo("#l3", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 1.8);
  tl.fromTo("#b3", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 1.0, ease: "power2.out" }, 2.2);
  tl.fromTo("#v3", { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 3.15);

  // row 4 · Lower third 23
  tl.to("#t4", { opacity: 1, duration: 0.3 }, 1.95);
  tl.fromTo("#l4", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 2.0);
  tl.fromTo("#b4", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 1.0, ease: "power2.out" }, 2.55);
  tl.fromTo("#v4", { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 3.5);

  // peak pulse on the yellow band
  tl.fromTo("#v2 .hl", { scale: 1 }, { scale: 1.08, duration: 0.2, ease: "power2.out" }, 4.1);
  tl.to("#v2 .hl", { scale: 1, duration: 0.25, ease: "power2.inOut" }, 4.3);

  // caption
  tl.to("#capL", { opacity: 1, duration: 0.5 }, 4.5);
  tl.to("#capR", { opacity: 1, duration: 0.5 }, 4.65);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
