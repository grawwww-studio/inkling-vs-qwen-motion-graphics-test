<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>How it works — three steps</title>
<link rel="stylesheet" href="lib/gw.css" />
<script src="vendor/gsap.min.js"></script>
<style>
  .a { position: absolute; }
  .lbl { font-family: var(--body); font-size: 40px; line-height: 1.25; color: #F4F4F1; }
  .icn { transform-origin: 50% 50%; }
  .conn { transform-origin: left center; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1920" data-height="1080">

  <img class="a" id="logo" src="assets/logo-negative.png" style="left:1620px;top:112px;width:140px;opacity:0" />

  <div class="a m" id="eyebrow" style="left:160px;top:150px;width:600px;font-size:26px;letter-spacing:6px;color:var(--c);opacity:0">PROCESS / 03 STEPS</div>

  <div class="a h" id="t1" style="left:160px;top:196px;font-size:130px;opacity:0">HOW IT <span class="hl">WORKS</span></div>

  <div class="a" id="rule" style="left:160px;top:372px;width:260px;height:6px;background:var(--m);transform-origin:left center"></div>

  <div class="a" id="sub" style="left:160px;top:408px;width:1100px;font-family:var(--body);font-size:34px;color:rgba(244,244,241,0.78);opacity:0">Three moves from brief to finished video.</div>

  <!-- STEP 01 -->
  <div class="a m" id="num1" style="left:160px;top:548px;width:200px;font-size:30px;letter-spacing:8px;color:var(--c);opacity:0">01</div>
  <svg class="a icn" id="icon1" style="left:295px;top:604px;width:130px" viewBox="0 0 130 130" fill="none" opacity="0">
    <rect x="16" y="14" width="70" height="94" stroke="#F4F4F1" stroke-width="6"/>
    <line x1="34" y1="40" x2="68" y2="40" stroke="#F4F4F1" stroke-width="6"/>
    <line x1="34" y1="58" x2="68" y2="58" stroke="#F4F4F1" stroke-width="6"/>
    <line x1="34" y1="76" x2="56" y2="76" stroke="#F4F4F1" stroke-width="6"/>
    <path d="M56 124 L62 108 L108 62 L118 72 L72 118 Z" stroke="#12A9E6" stroke-width="6"/>
  </svg>
  <div class="a lbl" id="label1" style="left:160px;top:772px;width:400px;opacity:0">Write a<br/>brief</div>

  <!-- CONNECTOR 1 -->
  <svg class="a conn" id="conn1" style="left:560px;top:663px;width:200px" viewBox="0 0 200 12">
    <line x1="2" y1="6" x2="170" y2="6" stroke="rgba(244,244,241,0.35)" stroke-width="4"/>
    <polygon points="170,0 198,6 170,12" fill="#F4F4F1"/>
  </svg>

  <!-- STEP 02 -->
  <div class="a m" id="num2" style="left:760px;top:548px;width:200px;font-size:30px;letter-spacing:8px;color:var(--m);opacity:0">02</div>
  <svg class="a icn" id="icon2" style="left:895px;top:604px;width:130px" viewBox="0 0 130 130" fill="none" opacity="0">
    <path d="M44 32 L16 65 L44 98" stroke="#FF2D92" stroke-width="6"/>
    <path d="M86 32 L114 65 L86 98" stroke="#FF2D92" stroke-width="6"/>
    <line x1="74" y1="24" x2="56" y2="106" stroke="#F4F4F1" stroke-width="6"/>
  </svg>
  <div class="a lbl" id="label2" style="left:760px;top:772px;width:400px;opacity:0">Model writes<br/>the code</div>

  <!-- CONNECTOR 2 -->
  <svg class="a conn" id="conn2" style="left:1160px;top:663px;width:200px" viewBox="0 0 200 12">
    <line x1="2" y1="6" x2="170" y2="6" stroke="rgba(244,244,241,0.35)" stroke-width="4"/>
    <polygon points="170,0 198,6 170,12" fill="#F4F4F1"/>
  </svg>

  <!-- STEP 03 -->
  <div class="a m" id="num3" style="left:1360px;top:548px;width:200px;font-size:30px;letter-spacing:8px;color:#F4F4F1;opacity:0">03</div>
  <svg class="a icn" id="icon3" style="left:1495px;top:604px;width:130px" viewBox="0 0 130 130" fill="none" opacity="0">
    <rect x="14" y="24" width="102" height="82" stroke="#F4F4F1" stroke-width="6"/>
    <path d="M52 44 L92 65 L52 86 Z" stroke="#F4F4F1" stroke-width="6"/>
  </svg>
  <div class="a lbl" id="label3" style="left:1360px;top:772px;width:400px;opacity:0">Render the<br/>video</div>

  <div class="a m" id="foot" style="left:160px;top:950px;width:900px;font-size:22px;letter-spacing:4px;color:rgba(244,244,241,0.5);opacity:0">BRIEF / CODE / VIDEO — 24 FPS</div>

</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // initial hidden states
  tl.set("#rule", { scaleX: 0 }, 0);
  tl.set("#conn1", { scaleX: 0 }, 0);
  tl.set("#conn2", { scaleX: 0 }, 0);

  // header
  tl.to("#logo", { opacity: 1, duration: 0.5 }, 0.1);
  tl.to("#eyebrow", { opacity: 1, duration: 0.4 }, 0.25);
  tl.fromTo("#t1", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.45);
  tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, 0.9);
  tl.to("#sub", { opacity: 1, duration: 0.5 }, 1.1);

  // step 01
  tl.to("#num1", { opacity: 1, duration: 0.3 }, 1.5);
  tl.fromTo("#icon1", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 1.6);
  tl.fromTo("#label1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.8);

  // connector 1
  tl.fromTo("#conn1", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 2.35);

  // step 02
  tl.to("#num2", { opacity: 1, duration: 0.3 }, 2.9);
  tl.fromTo("#icon2", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 3.0);
  tl.fromTo("#label2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 3.2);

  // connector 2
  tl.fromTo("#conn2", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 3.85);

  // step 03
  tl.to("#num3", { opacity: 1, duration: 0.3 }, 4.4);
  tl.fromTo("#icon3", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 4.5);
  tl.fromTo("#label3", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 4.7);

  // footer
  tl.to("#foot", { opacity: 1, duration: 0.5 }, 5.4);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
