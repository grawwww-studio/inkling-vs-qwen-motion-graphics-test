<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>B4 — Lower Third</title>
<link rel="stylesheet" href="lib/gw.css" />
<script src="vendor/gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">

  <div class="a" id="bar" style="left:100px;top:776px;width:12px;height:172px;background:#12A9E6;transform-origin:top center"></div>

  <div class="a h" id="name" style="left:148px;top:768px;font-size:110px;color:#F4F4F1;opacity:0;transform-origin:left center">Lara Quinn</div>

  <div class="a m" id="role" style="left:152px;top:890px;font-size:30px;color:#F4F4F1;opacity:0;transform-origin:left center">Presenter, Grawwww</div>

  <div class="a" id="rule" style="left:152px;top:936px;width:560px;height:4px;background:#FF2D92;transform-origin:left center"></div>

</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // initial hidden states
  tl.set("#bar", { scaleY: 0 }, 0);
  tl.set("#rule", { scaleX: 0 }, 0);

  // accent bar wipes in first
  tl.to("#bar", { scaleY: 1, duration: 0.5, ease: "power3.out" }, 0.15);

  // text slides in, staggered
  tl.fromTo("#name", { opacity: 0, x: -70 }, { opacity: 1, x: 0, duration: 0.55, ease: "power2.out" }, 0.5);
  tl.fromTo("#role", { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.65);
  tl.to("#rule", { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 0.85);

  // hold until 3.5s, then everything wipes out in the last 0.5s
  tl.to("#bar", { scaleY: 0, duration: 0.5, ease: "power2.in" }, 3.5);
  tl.to("#name", { scaleX: 0, duration: 0.5, ease: "power2.in" }, 3.5);
  tl.to("#role", { scaleX: 0, duration: 0.5, ease: "power2.in" }, 3.5);
  tl.to("#rule", { scaleX: 0, duration: 0.5, ease: "power2.in" }, 3.5);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
