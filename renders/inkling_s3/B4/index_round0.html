<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Lower Third — Lara Quinn</title>
<link rel="stylesheet" href="lib/gw.css" />
<script src="vendor/gsap.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #0E0E0E; }
  #root {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #0E0E0E;
  }
  .a { position: absolute; }
  #bar {
    left: 160px; top: 742px;
    width: 300px; height: 14px;
    background: #12A9E6;
    transform-origin: left center;
  }
  #name {
    left: 160px; top: 782px;
    width: 1400px;
    font-family: var(--display);
    font-size: 112px;
    line-height: 1;
    letter-spacing: 0.01em;
    color: #F4F4F1;
    text-transform: uppercase;
    white-space: nowrap;
  }
  #role {
    left: 160px; top: 928px;
    width: 1400px;
    font-family: var(--mono);
    font-size: 27px;
    letter-spacing: 0.22em;
    color: #12A9E6;
    text-transform: uppercase;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
  <div class="a" id="bar"></div>
  <div class="a" id="name">Lara Quinn</div>
  <div class="a" id="role">Presenter, Grawwww</div>
</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  tl.set("#bar", { scaleX: 0 }, 0);
  tl.set("#name", { x: -90, opacity: 0 }, 0);
  tl.set("#role", { x: -60, opacity: 0 }, 0);

  // entrance: bar wipes in first, then text slides in
  tl.to("#bar", { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.1);
  tl.to("#name", { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.45);
  tl.to("#role", { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.65);

  // hold, then wipe everything out in the last 0.5 s
  tl.to("#bar", { scaleX: 0, duration: 0.45, ease: "power3.in" }, 3.5);
  tl.to("#name", { x: -90, opacity: 0, duration: 0.4, ease: "power2.in" }, 3.5);
  tl.to("#role", { x: -60, opacity: 0, duration: 0.4, ease: "power2.in" }, 3.55);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
