<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>B1 — Local AI, Real Video</title>
<link rel="stylesheet" href="lib/gw.css" />
<script src="vendor/gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">

  <div class="a m" id="eyebrow" style="left:160px;top:290px;width:400px;font-size:28px;color:var(--c);opacity:0">EP05 / EXPERIMENT</div>

  <div class="a h" id="wLocal" style="left:160px;top:350px;width:500px;height:150px;font-size:150px;line-height:1;opacity:0">LOCAL</div>
  <div class="a h" id="wAi" style="left:710px;top:350px;width:200px;height:150px;font-size:150px;line-height:1;opacity:0">AI,</div>

  <div class="a hl" id="band" style="left:140px;top:552px;width:440px;height:136px;padding:0;background:#FFD400;transform-origin:left center"></div>
  <div class="a h" id="wReal" style="left:160px;top:540px;width:400px;height:150px;font-size:150px;line-height:1;color:#111;opacity:0">REAL</div>
  <div class="a h" id="wVideo" style="left:610px;top:540px;width:460px;height:150px;font-size:150px;line-height:1;opacity:0">VIDEO</div>

  <div class="a" id="rule" style="left:160px;top:760px;width:1600px;height:4px;background:#F4F4F1;transform-origin:left center"></div>

</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  tl.set("#band", { scaleX: 0 }, 0);
  tl.set("#rule", { scaleX: 0 }, 0);

  tl.fromTo("#eyebrow", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.15);
  tl.fromTo("#wLocal", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.45);
  tl.fromTo("#wAi", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.65);
  tl.fromTo("#band", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, 1.0);
  tl.fromTo("#wReal", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 1.2);
  tl.fromTo("#wVideo", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.35);
  tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 1.8);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
