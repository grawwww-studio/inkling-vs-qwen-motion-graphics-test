<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>B4 — Lower Third</title>
<link rel="stylesheet" href="lib/gw.css" />
<script src="vendor/gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">

  <!-- dark plate -->
  <div class="a" id="plate" style="left:0px;top:0px;width:1920px;height:1080px;background:#151515;opacity:0"></div>

  <!-- cyan accent bar (wipes in first) -->
  <div class="a" id="bar" style="left:120px;top:732px;width:16px;height:196px;background:var(--c);transform-origin:top center;opacity:0"></div>

  <!-- name -->
  <div class="a h" id="name" style="left:184px;top:738px;width:1200px;font-size:96px;letter-spacing:2px;color:#F4F4F1;opacity:0">Lara Quinn</div>

  <!-- role -->
  <div class="a m" id="role" style="left:188px;top:868px;width:900px;font-size:30px;letter-spacing:8px;color:#A3A39C;opacity:0">Presenter, Grawwww</div>

</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // plate settles in
  tl.fromTo("#plate", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0);

  // cyan bar wipes in first (grows from top)
  tl.fromTo("#bar", { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.45, ease: "power3.out" }, 0.15);

  // name slides in
  tl.fromTo("#name", { opacity: 0, x: -64 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.5);

  // role slides in just after
  tl.fromTo("#role", { opacity: 0, x: -64 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.65);

  // hold until 3.5, then everything wipes out in the last 0.5 s
  tl.set("#bar", { transformOrigin: "bottom center" }, 3.5);
  tl.to("#bar", { scaleY: 0, duration: 0.5, ease: "power2.in" }, 3.5);
  tl.to("#name", { opacity: 0, x: -64, duration: 0.5, ease: "power2.in" }, 3.5);
  tl.to("#role", { opacity: 0, x: -64, duration: 0.5, ease: "power2.in" }, 3.5);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
