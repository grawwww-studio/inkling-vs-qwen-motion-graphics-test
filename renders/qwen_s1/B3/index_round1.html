<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Render time per card</title>
<link rel="stylesheet" href="lib/gw.css" />
<script src="vendor/gsap.min.js"></script>
<style>
  body { margin: 0; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  img { display: block; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">

  <!-- header -->
  <div class="a m" id="eyebrow" style="left:100px;top:118px;font-size:24px;color:var(--c);opacity:0">Render bench · 4 cards</div>
  <div class="a h" id="title" style="left:100px;top:158px;font-size:84px;opacity:0">Render time per card (s)</div>
  <div class="a" id="rule" style="left:100px;top:290px;width:220px;height:6px;background:var(--c);transform-origin:left center"></div>
  <img id="logo" src="assets/logo-negative.png" alt="" class="a" style="left:1680px;top:120px;width:140px;opacity:0" />

  <!-- grid + axis -->
  <div class="a" id="grid" style="left:0px;top:0px;width:1920px;height:1080px;opacity:0">
    <div class="a" style="left:700px;top:372px;width:1px;height:528px;background:rgba(244,244,241,0.10)"></div>
    <div class="a" style="left:940px;top:372px;width:1px;height:528px;background:rgba(244,244,241,0.10)"></div>
    <div class="a" style="left:1180px;top:372px;width:1px;height:528px;background:rgba(244,244,241,0.10)"></div>
    <div class="a m" style="left:670px;top:908px;width:60px;text-align:center;font-size:22px;color:rgba(244,244,241,0.5)">20</div>
    <div class="a m" style="left:910px;top:908px;width:60px;text-align:center;font-size:22px;color:rgba(244,244,241,0.5)">40</div>
    <div class="a m" style="left:1150px;top:908px;width:60px;text-align:center;font-size:22px;color:rgba(244,244,241,0.5)">60 s</div>
  </div>
  <div class="a" id="baseline" style="left:459px;top:372px;width:2px;height:528px;background:rgba(244,244,241,0.30);transform-origin:center top"></div>

  <!-- row 1 : Title 42 -->
  <div class="a m" id="rl1" style="left:100px;top:418px;width:320px;text-align:right;font-size:26px;color:rgba(244,244,241,0.85);opacity:0">Title</div>
  <div class="a" id="bar1" style="left:460px;top:400px;width:0px;height:64px;background:var(--c)"></div>
  <div class="a m" id="vl1" style="left:984px;top:412px;font-size:40px;color:#F4F4F1;opacity:0">0</div>

  <!-- row 2 : Explainer 58 (max) -->
  <div class="a m" id="rl2" style="left:100px;top:558px;width:320px;text-align:right;font-size:26px;color:rgba(244,244,241,0.85);opacity:0">Explainer</div>
  <div class="a" id="bar2" style="left:460px;top:540px;width:0px;height:64px;background:var(--c)"></div>
  <div class="a" id="maxtag" style="left:1176px;top:508px;font-size:20px;font-family:var(--mono);text-transform:uppercase;letter-spacing:2px;color:var(--y);opacity:0">Max</div>
  <div class="a m hl" id="band" style="left:1176px;top:544px;width:112px;height:56px;line-height:56px;text-align:center;font-size:40px;background:#FFD400;color:#111;opacity:0">0</div>

  <!-- row 3 : Chart 51 -->
  <div class="a m" id="rl3" style="left:100px;top:698px;width:320px;text-align:right;font-size:26px;color:rgba(244,244,241,0.85);opacity:0">Chart</div>
  <div class="a" id="bar3" style="left:460px;top:680px;width:0px;height:64px;background:var(--c)"></div>
  <div class="a m" id="vl3" style="left:1092px;top:692px;font-size:40px;color:#F4F4F1;opacity:0">0</div>

  <!-- row 4 : Lower third 23 -->
  <div class="a m" id="rl4" style="left:100px;top:838px;width:320px;text-align:right;font-size:26px;color:rgba(244,244,241,0.85);opacity:0">Lower third</div>
  <div class="a" id="bar4" style="left:460px;top:820px;width:0px;height:64px;background:var(--c)"></div>
  <div class="a m" id="vl4" style="left:756px;top:832px;font-size:40px;color:#F4F4F1;opacity:0">0</div>

  <!-- footer + legend -->
  <div class="a m" id="foot" style="left:100px;top:950px;font-size:22px;color:rgba(244,244,241,0.55);opacity:0">Unit s · bars to scale · n = 4</div>
  <div id="legend" style="position:absolute;left:1240px;top:950px;width:600px;height:30px;opacity:0">
    <div class="a" style="left:0px;top:2px;width:18px;height:18px;background:var(--c)"></div>
    <div class="a m" style="left:28px;top:0px;font-size:22px;color:rgba(244,244,241,0.75)">Render time</div>
    <div class="a" style="left:230px;top:2px;width:18px;height:18px;background:#FFD400"></div>
    <div class="a m" style="left:258px;top:0px;font-size:22px;color:rgba(244,244,241,0.75)">Max</div>
  </div>

</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // header
  tl.fromTo("#eyebrow", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.1);
  tl.fromTo("#title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.25);
  tl.fromTo("#logo", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.4);
  tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, 0.5);

  // axis + grid
  tl.fromTo("#grid", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.6);
  tl.fromTo("#baseline", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power2.out" }, 0.6);

  // rows: label in, bar grows from zero, value counts up at bar end
  // scale: 12 px per second -> widths 504 / 696 / 612 / 276 (proportional to 42 / 58 / 51 / 23)
  const rows = [
    { l: "#rl1", b: "#bar1", v: "#vl1", val: 42, w: 504, t: 0.90 },
    { l: "#rl2", b: "#bar2", v: "#band", val: 58, w: 696, t: 1.25 },
    { l: "#rl3", b: "#bar3", v: "#vl3", val: 51, w: 612, t: 1.60 },
    { l: "#rl4", b: "#bar4", v: "#vl4", val: 23, w: 276, t: 1.95 }
  ];
  rows.forEach(function (r) {
    const el = document.querySelector(r.v);
    tl.fromTo(r.l, { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, r.t);
    tl.fromTo(r.b, { width: 0 }, { width: r.w, duration: 0.9, ease: "power3.out" }, r.t + 0.1);
    tl.fromTo(r.v, { opacity: 0 }, { opacity: 1, duration: 0.2 }, r.t + 0.1);
    const proxy = { v: 0 };
    tl.to(proxy, {
      v: r.val, duration: 0.9, ease: "power2.out",
      onUpdate: function () { el.textContent = Math.round(proxy.v); }
    }, r.t + 0.1);
  });

  // highlight the largest bar's value with the yellow band
  tl.fromTo("#band", { opacity: 0, x: 14 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 2.5);
  tl.fromTo("#maxtag", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 2.62);

  // footer + legend
  tl.fromTo("#foot", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 3.05);
  tl.fromTo("#legend", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 3.15);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
