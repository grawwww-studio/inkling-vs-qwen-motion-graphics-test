<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>B1 / Title Card</title>
<link rel="stylesheet" href="lib/gw.css" />
<script src="vendor/gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
  <div class="a m" id="eyebrow" style="left:160px;top:332px;font-size:30px;letter-spacing:8px;color:var(--c);opacity:0">EP05 / Experiment</div>

  <div class="a h" id="w1" style="left:160px;top:400px;font-size:150px;opacity:0">Local</div>
  <div class="a h" id="w2" style="left:650px;top:400px;font-size:150px;opacity:0">AI,</div>
  <div class="a h" id="w3" style="left:920px;top:400px;font-size:150px;opacity:0"><span class="hl">Real</span></div>
  <div class="a h" id="w4" style="left:1380px;top:400px;font-size:150px;opacity:0">Video</div>

  <div class="a" id="band" style="left:920px;top:400px;width:460px;height:150px;background:var(--y);transform-origin:left center"></div>

  <div class="a" id="rule" style="left:160px;top:640px;width:1600px;height:6px;background:var(--ink);transform-origin:left center"></div>
</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  tl.to("#eyebrow", { opacity: 1, duration: 0.4 }, 0.2);

  tl.fromTo("#w1", { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 0.55);
  tl.fromTo("#w2", { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 0.80);
  tl.fromTo("#w3", { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 1.05);
  tl.fromTo("#w4", { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 1.30);

  tl.fromTo("#band", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 1.55);

  tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 1.85);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
