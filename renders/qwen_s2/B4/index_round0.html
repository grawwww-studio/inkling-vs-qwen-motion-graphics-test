<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>B4 — Lower Third</title>
<link rel="stylesheet" href="lib/gw.css" />
<script src="vendor/gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">

  <!-- cyan accent bar: wipes in first, wipes out last -->
  <div class="a" id="bar" style="left:120px;top:735px;width:16px;height:215px;background:var(--c);transform-origin:left center"></div>

  <!-- name, display type -->
  <div class="a h" id="name" style="left:184px;top:742px;font-size:110px;opacity:0">Lara Quinn</div>

  <!-- role, mono label -->
  <div class="a m" id="role" style="left:188px;top:898px;font-size:30px;letter-spacing:4px;color:var(--ink);opacity:0">Presenter, Grawwww</div>

</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // initial hidden states
  tl.set("#bar",  { scaleX: 0 }, 0);
  tl.set("#name", { opacity: 0, x: -80 }, 0);
  tl.set("#role", { opacity: 0, x: -60 }, 0);

  // in: bar wipes in first, then text slides in
  tl.fromTo("#bar",  { scaleX: 0 }, { scaleX: 1, duration: 0.5,  ease: "power3.out" }, 0.15);
  tl.fromTo("#name", { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.45);
  tl.fromTo("#role", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.62);

  // hold 1.12 -> 3.5

  // out: everything wipes out in the last 0.5s
  tl.to("#name", { opacity: 0, x: -80, duration: 0.4,  ease: "power3.in" }, 3.5);
  tl.to("#role", { opacity: 0, x: -60, duration: 0.4,  ease: "power3.in" }, 3.5);
  tl.to("#bar",  { scaleX: 0,            duration: 0.45, ease: "power3.in" }, 3.5);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
